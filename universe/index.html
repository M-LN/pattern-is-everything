<script>
(function(){
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

const TAU=Math.PI*2,rand=(a,b)=>Math.random()*(b-a)+a,lerp=(a,b,t)=>a+(b-a)*t;
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

/* ── Collection metadata ── */
const COL_META={
  'stats':{name:'The Toolkit',color:'#4fc3f7',path:'../stats/index.html'},
  'ml-math':{name:'ML Math',color:'#5bc8f7',path:'../ml-math/index.html'},
  'llm':{name:'LLM Engineering',color:'#68d0f7',path:'../llm/index.html'},
  'mlops':{name:'MLOps & Production',color:'#3fb8e8',path:'../mlops/index.html'},
  'timeseries':{name:'Timeseries Engineering',color:'#29b6f6',path:'../timeseries/index.html'},
  'charts':{name:'Chart Patterns',color:'#81c784',path:'../markets/charts/index.html'},
  'indicators':{name:'Technical Indicators',color:'#6db870',path:'../markets/indicators/index.html'},
  'psychology':{name:'Market Psychology',color:'#95d48a',path:'../markets/psychology/index.html'},
  'risk':{name:'Risk & Portfolio',color:'#5cc4a0',path:'../markets/risk/index.html'}
};

/* ── Galaxy layout ── */
const CLUSTER={};
const ML_COLS=['stats','ml-math','llm','mlops','timeseries'];
const MKT_COLS=['charts','indicators','psychology','risk'];
ML_COLS.forEach((col,i)=>{
  const angle=Math.PI+0.55-i*0.42;
  const dist=300+i*130;
  CLUSTER[col]={x:Math.cos(angle)*dist,y:Math.sin(angle)*dist*0.68};
});
MKT_COLS.forEach((col,i)=>{
  const angle=0.55-i*0.42;
  const dist=300+i*130;
  CLUSTER[col]={x:Math.cos(angle)*dist,y:Math.sin(angle)*dist*0.68};
});

/* ── Place topics ── */
const nodes=[];
const colGroups={};
GAME_TOPICS.forEach(t=>{if(!colGroups[t.col])colGroups[t.col]=[];colGroups[t.col].push(t);});
const GA=Math.PI*(3-Math.sqrt(5));
Object.keys(colGroups).forEach(col=>{
  const c=CLUSTER[col],topics=colGroups[col],meta=COL_META[col];
  topics.forEach((t,i)=>{
    const r=16+7.5*Math.sqrt(i),theta=i*GA;
    nodes.push({...t,idx:nodes.length,wx:c.x+Math.cos(theta)*r,wy:c.y+Math.sin(theta)*r,
      color:meta.color,size:1.8+Math.random()*1.4,phase:rand(0,TAU),twSpeed:0.4+rand(0,2)});
  });
});

/* ── Cross-domain edges ── */
const crossEdges=[];
const kwIndex={};
nodes.forEach((n,i)=>n.kw.forEach(k=>{const kl=k.toLowerCase();if(!kwIndex[kl])kwIndex[kl]=[];kwIndex[kl].push(i);}));
Object.values(kwIndex).forEach(ids=>{
  for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){
    if(nodes[ids[a]].domain!==nodes[ids[b]].domain){
      crossEdges.push({a:ids[a],b:ids[b],kw:nodes[ids[a]].kw.filter(k=>nodes[ids[b]].kw.some(k2=>k2.toLowerCase()===k.toLowerCase()))});
    }
  }
});
/* Deduplicate and rank */
const edgeMap={};
crossEdges.forEach(e=>{const key=Math.min(e.a,e.b)+'-'+Math.max(e.a,e.b);if(!edgeMap[key])edgeMap[key]=e;else edgeMap[key].kw=[...new Set([...edgeMap[key].kw,...e.kw])];});
const edges=Object.values(edgeMap).sort((a,b)=>b.kw.length-a.kw.length).slice(0,250);
const edgeLookup={};
edges.forEach(e=>{if(!edgeLookup[e.a])edgeLookup[e.a]=[];edgeLookup[e.a].push(e);if(!edgeLookup[e.b])edgeLookup[e.b]=[];edgeLookup[e.b].push(e);});

/* Cross-keyword set for panel highlighting */
const crossKwSet=new Set();
if(typeof CROSS_KEYWORDS!=='undefined')CROSS_KEYWORDS.forEach(ck=>crossKwSet.add(ck.kw));

/* ── Background particles ── */
const dust=Array.from({length:350},()=>({x:rand(-900,900),y:rand(-700,700),r:rand(.2,1.1),phase:rand(0,TAU),sp:rand(.3,1.8)}));

/* ── Camera ── */
let cam={x:0,y:0,z:0.42},tgt={x:0,y:0,z:0.42};
let dragging=false,dragS={x:0,y:0},camS={x:0,y:0};
let mx=0,my=0,hovNode=null,selNode=null,introVis=true,time=0;

function w2s(wx,wy){return{sx:(wx-cam.x)*cam.z+W/2,sy:(wy-cam.y)*cam.z+H/2};}
function s2w(sx,sy){return{wx:(sx-W/2)/cam.z+cam.x,wy:(sy-H/2)/cam.z+cam.y};}
function onScreen(sx,sy,pad){return sx>-pad&&sx<W+pad&&sy>-pad&&sy<H+pad;}

/* ── Drawing ── */
function drawBg(){
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  g.addColorStop(0,'#0c0a14');g.addColorStop(1,'#050508');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawCore(){
  const c=w2s(0,0),r=220*cam.z;
  const g=ctx.createRadialGradient(c.sx,c.sy,0,c.sx,c.sy,r);
  g.addColorStop(0,'rgba(200,169,110,0.07)');g.addColorStop(.4,'rgba(200,169,110,0.025)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(c.sx,c.sy,r,0,TAU);ctx.fill();
  /* tiny bright center */
  const g2=ctx.createRadialGradient(c.sx,c.sy,0,c.sx,c.sy,8*cam.z);
  g2.addColorStop(0,'rgba(255,240,200,0.3)');g2.addColorStop(1,'transparent');
  ctx.fillStyle=g2;ctx.beginPath();ctx.arc(c.sx,c.sy,8*cam.z,0,TAU);ctx.fill();
}
function drawNebulae(){
  Object.keys(CLUSTER).forEach(col=>{
    const cc=CLUSTER[col],meta=COL_META[col],topics=colGroups[col]||[];
    const s=w2s(cc.x,cc.y),r=(55+topics.length*2.8)*cam.z;
    if(!onScreen(s.sx,s.sy,r+50))return;
    const pulse=.5+.15*Math.sin(time*.4+cc.x*.008);
    const g=ctx.createRadialGradient(s.sx,s.sy,0,s.sx,s.sy,r);
    g.addColorStop(0,hexA(meta.color,.045*pulse));g.addColorStop(.6,hexA(meta.color,.015*pulse));g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.sx,s.sy,r,0,TAU);ctx.fill();
  });
}
function drawDust(){
  dust.forEach(d=>{
    const s=w2s(d.x,d.y);if(!onScreen(s.sx,s.sy,5))return;
    const tw=.3+.7*(Math.sin(time*d.sp+d.phase)*.5+.5);
    ctx.beginPath();ctx.arc(s.sx,s.sy,Math.max(.3,d.r*cam.z),0,TAU);
    ctx.fillStyle=`rgba(200,180,140,${.1*tw})`;ctx.fill();
  });
}
function drawEdges(){
  if(cam.z<0.25)return;
  const baseA=Math.min(.14,.04+cam.z*.06);
  edges.forEach(e=>{
    const na=nodes[e.a],nb=nodes[e.b];
    const sa=w2s(na.wx,na.wy),sb=w2s(nb.wx,nb.wy);
    if(!onScreen(sa.sx,sa.sy,50)&&!onScreen(sb.sx,sb.sy,50))return;
    const isSel=selNode&&(selNode.idx===e.a||selNode.idx===e.b);
    const a=isSel?baseA*3.5:baseA*Math.min(1,e.kw.length*.5);
    const gr=ctx.createLinearGradient(sa.sx,sa.sy,sb.sx,sb.sy);
    gr.addColorStop(0,hexA(na.color,a));gr.addColorStop(1,hexA(nb.color,a));
    ctx.beginPath();ctx.moveTo(sa.sx,sa.sy);ctx.lineTo(sb.sx,sb.sy);
    ctx.strokeStyle=gr;ctx.lineWidth=isSel?1.2:.5;ctx.stroke();
    /* Traveling light */
    if(isSel||cam.z>.6){
      const ft=((time*.3+e.a*.13)%1);
      const px=sa.sx+(sb.sx-sa.sx)*ft,py=sa.sy+(sb.sy-sa.sy)*ft;
      ctx.beginPath();ctx.arc(px,py,isSel?2:1,0,TAU);ctx.fillStyle=hexA('#fff',isSel?.4:.12);ctx.fill();
    }
  });
}
function drawNodes(){
  nodes.forEach(n=>{
    const s=w2s(n.wx,n.wy);if(!onScreen(s.sx,s.sy,30))return;
    const r=Math.max(1.2,n.size*cam.z);
    const isH=hovNode&&hovNode.idx===n.idx,isS=selNode&&selNode.idx===n.idx;
    const tw=.5+.5*Math.sin(time*n.twSpeed+n.phase);
    /* Glow */
    const gr=r*(isH?5.5:isS?5:2.8);
    const g=ctx.createRadialGradient(s.sx,s.sy,0,s.sx,s.sy,gr);
    g.addColorStop(0,hexA(n.color,(isH?.28:isS?.22:.07)*tw));g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.sx,s.sy,gr,0,TAU);ctx.fill();
    /* Core */
    const cg=ctx.createRadialGradient(s.sx,s.sy,0,s.sx,s.sy,r);
    cg.addColorStop(0,'rgba(255,255,255,.9)');cg.addColorStop(.35,n.color);cg.addColorStop(1,hexA(n.color,.2));
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(s.sx,s.sy,r,0,TAU);ctx.fill();
    /* Selection ring */
    if(isH||isS){ctx.beginPath();ctx.arc(s.sx,s.sy,r*2.8+2*Math.sin(time*3),0,TAU);ctx.strokeStyle=hexA(n.color,.45);ctx.lineWidth=1;ctx.stroke();}
    /* Label */
    if(isH||isS||cam.z>1.3){
      const fs=Math.max(7,Math.min(11,9*cam.z));
      ctx.font=fs+"px 'Space Mono',monospace";ctx.textAlign='center';
      ctx.fillStyle=hexA('#e8e4dc',isH||isS?.92:.45);
      ctx.fillText(n.title,s.sx,s.sy-r-5);
    }
  });
}
function drawClusterLabels(){
  if(cam.z>1.6)return;
  const a=Math.max(0,Math.min(.38,.38-(cam.z-.7)*.5));if(a<=0)return;
  ctx.font="bold 10px 'Space Mono',monospace";ctx.textAlign='center';
  Object.keys(CLUSTER).forEach(col=>{
    const cc=CLUSTER[col],meta=COL_META[col];
    const total=colGroups[col]?colGroups[col].length:0;
    const s=w2s(cc.x,cc.y-(30+total*1.2));
    if(!onScreen(s.sx,s.sy,120))return;
    ctx.fillStyle=hexA(meta.color,a);ctx.fillText(meta.name.toUpperCase(),s.sx,s.sy);
    ctx.font="9px 'Space Mono',monospace";
    ctx.fillStyle=hexA(meta.color,a*.5);ctx.fillText(total+' topics',s.sx,s.sy+14);
    ctx.font="bold 10px 'Space Mono',monospace";
  });
}

/* ── Hit detection ── */
function findNode(sx,sy){
  let best=null,bd=Infinity;
  nodes.forEach(n=>{
    const s=w2s(n.wx,n.wy);
    const d=Math.hypot(s.sx-sx,s.sy-sy);
    const hitR=Math.max(12,n.size*cam.z*3.5);
    if(d<hitR&&d<bd){best=n;bd=d;}
  });
  return best;
}

/* ── Info panel ── */
const panel=document.getElementById('panel');
function openPanel(n){
  const m=COL_META[n.col];
  document.getElementById('panel-col').textContent=m.name;
  document.getElementById('panel-col').style.color=m.color;
  document.getElementById('panel-title').textContent=n.title;
  document.getElementById('panel-cat').textContent=n.cat;
  document.getElementById('panel-keywords').innerHTML=n.kw.map(k=>'<span class="kw-chip'+(crossKwSet.has(k.toLowerCase())?' cross-kw':'')+'">'+k+'</span>').join('');
  const conns=(edgeLookup[n.idx]||[]).map(e=>{const oi=e.a===n.idx?e.b:e.a;return{node:nodes[oi],kw:e.kw};});
  const cl=document.getElementById('panel-conn-list');
  cl.innerHTML=conns.length?conns.map(c=>'<div class="conn-item" data-i="'+c.node.idx+'"><div class="conn-dot" style="background:'+c.node.color+'"></div><span class="conn-name">'+c.node.title+'</span><span class="conn-kw">'+c.kw[0]+'</span></div>').join(''):'<div style="font-size:12px;color:rgba(232,228,220,.25);font-style:italic">No cross-domain connections</div>';
  cl.querySelectorAll('.conn-item').forEach(el=>el.addEventListener('click',()=>{
    const nd=nodes[+el.dataset.i];selNode=nd;tgt.x=nd.wx;tgt.y=nd.wy;tgt.z=Math.max(cam.z,2.2);openPanel(nd);panel.scrollTop=0;
  }));
  document.getElementById('panel-link').href=m.path+'#'+n.id;
  panel.classList.add('open');
}
function closePanel(){panel.classList.remove('open');}
document.getElementById('panel-close').onclick=()=>{selNode=null;closePanel();};

/* ── Search ── */
const sOverlay=document.getElementById('search-overlay'),sInput=document.getElementById('search-input'),sResults=document.getElementById('search-results');
function openSearch(){sOverlay.classList.add('active');sInput.value='';sInput.focus();sResults.innerHTML='';}
function closeSearch(){sOverlay.classList.remove('active');}
sInput.addEventListener('input',()=>{
  const q=sInput.value.toLowerCase().trim();
  const m=q?nodes.filter(n=>n.title.toLowerCase().includes(q)||n.cat.toLowerCase().includes(q)||n.kw.some(k=>k.toLowerCase().includes(q))).slice(0,12):[];
  sResults.innerHTML=m.map(n=>'<div class="search-item" data-i="'+n.idx+'"><div class="search-dot" style="background:'+n.color+'"></div><span class="search-title">'+n.title+'</span><span class="search-col">'+COL_META[n.col].name+'</span></div>').join('');
  sResults.querySelectorAll('.search-item').forEach(el=>el.addEventListener('click',()=>{
    const nd=nodes[+el.dataset.i];selNode=nd;tgt.x=nd.wx;tgt.y=nd.wy;tgt.z=2.5;openPanel(nd);closeSearch();
  }));
});
sOverlay.addEventListener('click',e=>{if(e.target===sOverlay)closeSearch();});
sInput.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();});

/* ── Events ── */
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSearch();}
  if(e.key==='Escape'){if(sOverlay.classList.contains('active'))closeSearch();else if(selNode){selNode=null;closePanel();}}
});
canvas.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  if(dragging){tgt.x=camS.x-(e.clientX-dragS.x)/cam.z;tgt.y=camS.y-(e.clientY-dragS.y)/cam.z;hideIntro();}
  hovNode=findNode(mx,my);
  const tip=document.getElementById('tip');
  if(hovNode){tip.textContent=hovNode.title;tip.style.left=(mx+16)+'px';tip.style.top=(my-8)+'px';tip.classList.add('show');canvas.style.cursor='pointer';}
  else{tip.classList.remove('show');canvas.style.cursor=dragging?'grabbing':'grab';}
});
canvas.addEventListener('mousedown',e=>{dragging=true;dragS={x:e.clientX,y:e.clientY};camS={x:tgt.x,y:tgt.y};canvas.classList.add('dragging');});
canvas.addEventListener('mouseup',e=>{
  const moved=Math.hypot(e.clientX-dragS.x,e.clientY-dragS.y);
  dragging=false;canvas.classList.remove('dragging');canvas.style.cursor=hovNode?'pointer':'grab';
  if(moved<5){if(hovNode){selNode=hovNode;tgt.x=hovNode.wx;tgt.y=hovNode.wy;tgt.z=Math.max(cam.z,2.2);openPanel(hovNode);hideIntro();}else{selNode=null;closePanel();}}
});
canvas.addEventListener('wheel',e=>{e.preventDefault();tgt.z=Math.max(.12,Math.min(6,tgt.z*(1-e.deltaY*.001)));hideIntro();},{passive:false});

/* Touch */
let lastTD=0;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){dragging=true;dragS={x:e.touches[0].clientX,y:e.touches[0].clientY};camS={x:tgt.x,y:tgt.y};}
  if(e.touches.length===2){lastTD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
  hideIntro();
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&dragging){tgt.x=camS.x-(e.touches[0].clientX-dragS.x)/cam.z;tgt.y=camS.y-(e.touches[0].clientY-dragS.y)/cam.z;}
  if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(lastTD>0)tgt.z=Math.max(.12,Math.min(6,tgt.z*(d/lastTD)));lastTD=d;}
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(e.touches.length===0){dragging=false;lastTD=0;
    const ct=e.changedTouches[0];if(ct){const moved=Math.hypot(ct.clientX-dragS.x,ct.clientY-dragS.y);
    if(moved<10){const nd=findNode(ct.clientX,ct.clientY);if(nd){selNode=nd;tgt.x=nd.wx;tgt.y=nd.wy;tgt.z=Math.max(cam.z,2.2);openPanel(nd);}else{selNode=null;closePanel();}}}
  }
});

function hideIntro(){if(introVis){introVis=false;document.getElementById('intro').classList.add('hidden');}}

/* ── Main loop ── */
let lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-lastT)/1000,.05);lastT=now;time+=dt;
  cam.x=lerp(cam.x,tgt.x,.07);cam.y=lerp(cam.y,tgt.y,.07);cam.z=lerp(cam.z,tgt.z,.07);
  drawBg();drawCore();drawNebulae();drawDust();drawEdges();drawNodes();drawClusterLabels();
}
requestAnimationFrame(frame);
setTimeout(()=>document.getElementById('controls').classList.add('hidden'),8000);
})();
</script>
</body>

/* Options */

#over-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:24px;}

#over-btns button:hover,#over-btns a:hover{border-color:var(--gold);background:rgba(200,169,110,.08);}

@media(max-width:600px){

  .option-btn{min-width:100px;padding:8px 16px;font-size:11px;}
}

<script>
(function(){
'use strict';

/* ── Canvas ── */
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
let W,H;
function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
resize();window.addEventListener('resize',resize);

const TAU=Math.PI*2,rand=(a,b)=>Math.random()*(b-a)+a,lerp=(a,b,t)=>a+(b-a)*t;
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
function easeOut(t){return 1-Math.pow(1-t,3);}

const DC={ml:'#4fc3f7',markets:'#81c784',gold:'#c8a96e',bg:'#050508'};
const COL_NAMES={'stats':'The Toolkit','ml-math':'ML Math','llm':'LLM Engineering','mlops':'MLOps','timeseries':'Timeseries Engineering','charts':'Chart Patterns','indicators':'Indicators','psychology':'Psychology','risk':'Risk & Portfolio'};

/* ── Stars background ── */
const stars=Array.from({length:120},()=>({x:rand(0,1),y:rand(0,1),r:rand(.3,1.3),sp:rand(.3,2),ph:rand(0,TAU)}));

function drawBg(t){
  const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  bg.addColorStop(0,'#0c0a14');bg.addColorStop(1,'#050508');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{
    const tw=.3+.7*(Math.sin(t*s.sp+s.ph)*.5+.5);
    ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,TAU);
    ctx.fillStyle=`rgba(200,180,140,${.08*tw})`;ctx.fill();
  });
}

/* ── Constellation (grows as you play) ── */
const constNodes=[];
const constEdges=[];

function addConstPair(topicA,topicB,keyword){
  const aIdx=constNodes.length;
  const bIdx=constNodes.length+1;
  const totalPairs=(constEdges.length+1);
  /* ML nodes on left semicircle, Markets on right */
  const mlI=constNodes.filter(n=>n.domain==='ml').length;
  const mktI=constNodes.filter(n=>n.domain==='markets').length;
  const r=Math.min(W,H)*.32;
  const cx=W/2,cy=H/2;
  const aAngle=topicA.domain==='ml'?Math.PI+.3+mlI*.28:(.3+mktI*.28);
  const bAngle=topicB.domain==='ml'?Math.PI+.3+(mlI+1)*.28:(.3+(mktI+1)*.28);

  constNodes.push({x:cx+Math.cos(aAngle)*r,y:cy+Math.sin(aAngle)*r,color:DC[topicA.domain],title:topicA.title,domain:topicA.domain,born:performance.now()});
  constNodes.push({x:cx+Math.cos(bAngle)*r,y:cy+Math.sin(bAngle)*r,color:DC[topicB.domain],title:topicB.title,domain:topicB.domain,born:performance.now()});
  constEdges.push({a:aIdx,b:bIdx,keyword,born:performance.now()});
}

function drawConstellation(t,alpha){
  if(!constNodes.length)return;
  const now=performance.now();
  /* Edges */
  constEdges.forEach(e=>{
    const age=Math.min(1,(now-e.born)/800);
    const na=constNodes[e.a],nb=constNodes[e.b];
    const gr=ctx.createLinearGradient(na.x,na.y,nb.x,nb.y);
    gr.addColorStop(0,hexA(na.color,.12*age*alpha));gr.addColorStop(1,hexA(nb.color,.12*age*alpha));
    ctx.beginPath();ctx.moveTo(na.x,na.y);ctx.lineTo(nb.x,nb.y);ctx.strokeStyle=gr;ctx.lineWidth=1;ctx.stroke();
    /* traveling light */
    const ft=((t*.3+e.a*.4)%1)*age;
    const px=na.x+(nb.x-na.x)*ft,py=na.y+(nb.y-na.y)*ft;
    ctx.beginPath();ctx.arc(px,py,1.5,0,TAU);ctx.fillStyle=hexA('#fff',.15*age*alpha);ctx.fill();
  });
  /* Nodes */
  constNodes.forEach(n=>{
    const age=Math.min(1,(now-n.born)/600);
    const r=3*age;
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*3);
    g.addColorStop(0,hexA(n.color,.15*age*alpha));g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,r*3,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,TAU);
    const cg=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r);
    cg.addColorStop(0,'rgba(255,255,255,.7)');cg.addColorStop(.5,n.color);cg.addColorStop(1,'transparent');
    ctx.fillStyle=cg;ctx.fill();
  });
}

/* ── VFX particles ── */
let particles=[];
function burst(x,y,color,count){
  for(let i=0;i<count;i++){
    const angle=rand(0,TAU),speed=rand(2,6);
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:rand(1.5,3),color,life:1,decay:rand(.015,.04)});
  }
}
function updateParticles(){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.r*=.98;p.life-=p.decay;});particles=particles.filter(p=>p.life>0);}
function drawParticles(){particles.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,p.r),0,TAU);ctx.fillStyle=hexA(p.color,p.life*.7);ctx.fill();});}

/* ── Question generation ── */
/* Pre-compute valid cross-domain pairs */
const validPairs=[];
for(let i=0;i<GAME_TOPICS.length;i++){
  if(GAME_TOPICS[i].domain!=='ml')continue;
  for(let j=0;j<GAME_TOPICS.length;j++){
    if(GAME_TOPICS[j].domain!=='markets')continue;
    const shared=GAME_TOPICS[i].kw.filter(k=>GAME_TOPICS[j].kw.some(k2=>k2.toLowerCase()===k.toLowerCase()));
    if(shared.length>=1)validPairs.push({ml:GAME_TOPICS[i],mkt:GAME_TOPICS[j],shared});
  }
}

/* All keywords pool for distractors */
const allKws=[...new Set(GAME_TOPICS.flatMap(t=>t.kw))];

function generateQuestion(){
  if(!validPairs.length)return null;
  const pair=validPairs[Math.floor(rand(0,validPairs.length))];
  const correct=pair.shared[Math.floor(rand(0,pair.shared.length))];
  /* Distractors: keywords not in either topic */
  const used=new Set([...pair.ml.kw,...pair.mkt.kw].map(k=>k.toLowerCase()));
  const pool=allKws.filter(k=>!used.has(k.toLowerCase()));
  const shuffled=pool.sort(()=>Math.random()-.5);
  const distractors=[shuffled[0]||'entropy',shuffled[1]||'gradient'];
  const options=[correct,distractors[0],distractors[1]].sort(()=>Math.random()-.5);
  return{topicA:pair.ml,topicB:pair.mkt,correct,options};
}

/* ── Game state ── */
const G={
  state:'title',score:0,highScore:0,prevHi:0,
  lives:3,maxLives:3,round:0,maxRounds:15,
  chain:0,bestChain:0,correct:0,wrong:0,
  timerMax:15,timerLeft:15,
  currentQ:null,answered:false
};
try{const s=localStorage.getItem('patternWeaver_hi');if(s)G.highScore=parseInt(s,10)||0;}catch(e){}

function showHiScore(){
  const el=document.getElementById('hi-score');
  el.textContent=G.highScore>0?'HIGH SCORE: '+G.highScore:'';
}
showHiScore();

/* ── UI helpers ── */
function showScreen(name){
  document.getElementById('title-screen').style.display=name==='title'?'flex':'none';
  document.getElementById('play-screen').style.display=name==='play'?'block':'none';
  document.getElementById('over-screen').style.display=name==='over'?'block':'none';
}

function renderLives(){
  const el=document.getElementById('lives-area');
  el.innerHTML='';
  for(let i=0;i<G.maxLives;i++){
    const h=document.createElement('span');
    h.className='heart'+(i>=G.lives?' lost':'');
    h.textContent='\u2665';h.style.color=i<G.lives?DC.gold:'rgba(200,169,110,.15)';
    el.appendChild(h);
  }
}

function setCard(prefix,topic){
  const color=DC[topic.domain];
  const badge=document.getElementById('badge-'+prefix);
  badge.textContent=topic.domain==='ml'?'MACHINE LEARNING':'MARKETS';
  badge.style.color=color;badge.style.background=hexA(color,.08);badge.style.border='1px solid '+hexA(color,.2);
  document.getElementById('name-'+prefix).textContent=topic.title;
  document.getElementById('cat-'+prefix).textContent=topic.cat;
  document.getElementById('col-'+prefix).textContent=COL_NAMES[topic.col]||topic.col;
  document.getElementById('card-'+prefix).style.borderColor=hexA(color,.2);
}

function renderQuestion(){
  const q=G.currentQ;if(!q)return;
  setCard('a',q.topicA);
  setCard('b',q.topicB);
  document.getElementById('round-text').textContent='ROUND '+(G.round)+' / '+G.maxRounds;
  const opts=document.getElementById('options');
  opts.innerHTML='';
  q.options.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='option-btn';btn.textContent=opt;
    btn.addEventListener('click',()=>handleAnswer(opt,btn));
    opts.appendChild(btn);
  });
  document.getElementById('feedback').textContent='';
  G.answered=false;
}

function handleAnswer(chosen,btn){
  if(G.answered)return;
  G.answered=true;
  const q=G.currentQ;
  const isCorrect=chosen.toLowerCase()===q.correct.toLowerCase();
  /* Disable all buttons */
  document.querySelectorAll('.option-btn').forEach(b=>{
    b.classList.add('disabled');
    if(b.textContent.toLowerCase()===q.correct.toLowerCase())b.classList.add('correct');
  });
  if(isCorrect){
    btn.classList.add('correct');
    G.chain++;G.correct++;
    if(G.chain>G.bestChain)G.bestChain=G.chain;
    let multi=1;
    if(G.chain>=10)multi=5;else if(G.chain>=6)multi=3;else if(G.chain>=3)multi=2;
    const pts=10*multi;
    G.score+=pts;
    document.getElementById('score-val').textContent=G.score;
    document.getElementById('chain-val').textContent=G.chain>=2?'\u00d7'+multi+' CHAIN ('+G.chain+')':'';
    document.getElementById('feedback').textContent='\u2713 +'+pts+(multi>1?' ('+multi+'\u00d7 chain)':'');
    document.getElementById('feedback').style.color=DC.gold;
    addConstPair(q.topicA,q.topicB,q.correct);
    burst(W/2,H/2,DC.gold,35);
    const cA=document.getElementById('card-a'),cB=document.getElementById('card-b');
    cA.style.borderColor=DC.gold;cA.style.boxShadow='0 0 20px rgba(200,169,110,.15)';
    cB.style.borderColor=DC.gold;cB.style.boxShadow='0 0 20px rgba(200,169,110,.15)';
  }else{
    btn.classList.add('wrong');
    G.chain=0;G.wrong++;G.lives--;
    document.getElementById('chain-val').textContent='';
    document.getElementById('feedback').textContent='\u2717 The connection was: '+q.correct;
    document.getElementById('feedback').style.color='#e05040';
    renderLives();
    burst(W/2,H/2,'#e05040',20);
    if(G.lives<=0){setTimeout(()=>gameOver(),1200);return;}
  }
  setTimeout(()=>nextRound(),1400);
}

function nextRound(){
  G.round++;
  if(G.round>G.maxRounds||G.lives<=0){gameOver();return;}
  G.timerMax=Math.max(8,15-G.round*.4);
  G.timerLeft=G.timerMax;
  G.currentQ=generateQuestion();
  if(!G.currentQ){gameOver();return;}
  renderQuestion();
}

function startGame(){
  G.state='play';G.score=0;G.lives=G.maxLives;G.round=0;G.chain=0;G.bestChain=0;G.correct=0;G.wrong=0;G.prevHi=G.highScore;
  constNodes.length=0;constEdges.length=0;particles.length=0;
  document.getElementById('score-val').textContent='0';
  document.getElementById('chain-val').textContent='';
  renderLives();showScreen('play');
  nextRound();
}

function gameOver(){
  G.state='over';
  if(G.score>G.highScore){G.highScore=G.score;try{localStorage.setItem('patternWeaver_hi',G.highScore);}catch(e){}}
  document.getElementById('final-score').textContent=G.score;
  document.getElementById('final-stats').innerHTML=
    'Round '+Math.min(G.round,G.maxRounds)+' / '+G.maxRounds+
    ' &middot; '+G.correct+' correct'+
    ' &middot; '+G.wrong+' wrong'+
    ' &middot; Best chain: '+G.bestChain;
  const newHi=document.getElementById('new-hi');
  newHi.classList.toggle('show',G.score>G.prevHi&&G.prevHi>0);
  showScreen('over');
}

/* ── Timer ── */
let lastTick=0;
function updateTimer(now){
  if(G.state!=='play'||G.answered)return;
  if(!lastTick){lastTick=now;return;}
  G.timerLeft-=(now-lastTick)/1000;
  lastTick=now;
  if(G.timerLeft<=0){
    G.timerLeft=0;G.answered=true;G.chain=0;
    document.getElementById('chain-val').textContent='';
    document.getElementById('feedback').textContent='\u23f0 Time! The connection was: '+(G.currentQ?G.currentQ.correct:'');
    document.getElementById('feedback').style.color='rgba(200,169,110,.5)';
    document.querySelectorAll('.option-btn').forEach(b=>{
      b.classList.add('disabled');
      if(G.currentQ&&b.textContent.toLowerCase()===G.currentQ.correct.toLowerCase())b.classList.add('correct');
    });
    setTimeout(()=>nextRound(),1800);
  }
  const pct=Math.max(0,G.timerLeft/G.timerMax*100);
  document.getElementById('timer-fill').style.width=pct+'%';
  document.getElementById('timer-fill').style.background=G.timerLeft<4?'#e05040':DC.gold;
  document.getElementById('timer-text').textContent=Math.ceil(G.timerLeft)+'s';
}

/* ── Event bindings ── */
document.getElementById('start-btn').addEventListener('click',startGame);
document.getElementById('replay-btn').addEventListener('click',()=>{showHiScore();startGame();});

/* ── Main loop ── */
function frame(now){
  requestAnimationFrame(frame);
  const t=now/1000;
  drawBg(t);
  const constAlpha=G.state==='over'?1:.35;
  drawConstellation(t,constAlpha);
  updateParticles();drawParticles();
  updateTimer(now);
}
requestAnimationFrame(frame);
showScreen('title');
})();
</script>

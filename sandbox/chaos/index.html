<script>
/* ── Theme ── */
function toggleTheme() {
  const d = document.documentElement;
  d.setAttribute('data-theme', d.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  localStorage.setItem('theme', d.getAttribute('data-theme'));
}
const savedTheme = localStorage.getItem('theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.setAttribute('data-theme', 'dark');

/* ── Search ── */
function toggleSearch() {
  const o = document.getElementById('searchOverlay');
  o.classList.toggle('active');
  if (o.classList.contains('active')) {
    document.getElementById('searchInput').focus();
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '';
  }
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); toggleSearch(); }
  if (e.key === 'Escape') {
    const o = document.getElementById('searchOverlay');
    if (o.classList.contains('active')) toggleSearch();
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (document.activeElement.tagName === 'INPUT') return;
    const idx = TOPICS.indexOf(currentTopic);
    if (e.key === 'ArrowLeft' && idx > 0) show(TOPICS[idx - 1]);
    if (e.key === 'ArrowRight' && idx < TOPICS.length - 1) show(TOPICS[idx + 1]);
  }
});
document.getElementById('searchInput')?.addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  const res = document.getElementById('searchResults');
  if (!q) { res.innerHTML = ''; return; }
  const matches = TOPIC_DATA.filter(t =>
    t.title.toLowerCase().includes(q) ||
    t.category.toLowerCase().includes(q) ||
    t.keywords.some(k => k.toLowerCase().includes(q)) ||
    t.content.toLowerCase().includes(q)
  ).slice(0, 8);
  res.innerHTML = matches.map(t =>
    `<div class="search-result" onclick="show('${t.id}');toggleSearch();">
      <div class="sr-cat">${t.num} — ${t.category}</div>
      <div class="sr-title">${t.title}</div>
    </div>`
  ).join('') || '<div style="padding:16px 20px;font-family:var(--mono);font-size:12px;color:var(--muted)">No results</div>';
});

/* ── Navigation ── */
let currentTopic = null;
const viewed = new Set();

function show(id, scrollNav) {
  currentTopic = id;
  document.querySelectorAll('.topic').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.ni').forEach(n => n.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
  const ni = document.querySelector(`.ni[data-topic="${id}"]`);
  if (ni) { ni.classList.add('active'); if (scrollNav) ni.scrollIntoView({ block: 'nearest' }); }
  viewed.add(id);
  updateProgress();
  setTimeout(() => { if (DRAWS[id]) DRAWS[id](); }, 60);
  history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function updateProgress() {
  const total = TOPICS.length;
  const n = viewed.size;
  const pct = Math.round(n / total * 100);
  const bar = document.getElementById('progressBar');
  const txt = document.getElementById('progressText');
  if (bar) bar.style.width = pct + '%';
  if (txt) txt.textContent = `${n} / ${total} viewed`;
}

/* ── Init ── */
window.addEventListener('load', () => {
  buildContent();
  if (location.hash) {
    const id = location.hash.slice(1);
    if (TOPICS.includes(id)) { show(id, true); return; }
  }
  if (TOPICS.length > 0) show(TOPICS[0], true);
});

/* ── Formula Decoder ── */
(function() {
  const tooltip = document.createElement('div');
  tooltip.id = 'fd-tooltip';
  tooltip.className = 'fd-tooltip';
  tooltip.innerHTML = '<div class="fd-tooltip-symbol"></div><div class="fd-tooltip-def"></div>';
  document.body.appendChild(tooltip);

  let activeEl = null;

  document.addEventListener('click', function(e) {
    const term = e.target.closest('.fd-term');
    if (term) {
      e.stopPropagation();
      if (activeEl && activeEl !== term) activeEl.classList.remove('fd-active');
      activeEl = term;
      term.classList.toggle('fd-active');
      if (term.classList.contains('fd-active')) {
        tooltip.querySelector('.fd-tooltip-symbol').textContent = term.dataset.sym || term.textContent;
        tooltip.querySelector('.fd-tooltip-def').textContent = term.dataset.def || '';
        positionTooltip(term, tooltip);
        tooltip.classList.add('fd-visible');
      } else {
        tooltip.classList.remove('fd-visible');
        activeEl = null;
      }
      return;
    }
    if (!tooltip.contains(e.target)) {
      tooltip.classList.remove('fd-visible');
      if (activeEl) { activeEl.classList.remove('fd-active'); activeEl = null; }
    }
  });

  function positionTooltip(el, tip) {
    const r = el.getBoundingClientRect();
    let left = r.left;
    let top = r.bottom + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    const tw = tip.offsetWidth || 300;
    const th = tip.offsetHeight || 100;
    if (left + tw > window.innerWidth - 12) left = window.innerWidth - tw - 12;
    if (left < 12) left = 12;
    if (top + th > window.innerHeight - 12) top = r.top - th - 8;
    if (top < 12) top = 12;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
})();
</script>

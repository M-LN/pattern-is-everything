# Weekly review queue. Fails — and so emails the repository owner — when topics
# are due to be checked against their sources again (scripts/reviews.mjs):
# six months after their last review in LLM Engineering and MLOps, eighteen
# elsewhere. Mark a topic reviewed by updating reviewed: in its TOPIC_DATA.
name: Review queue

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/reviews.mjs --ci

<!doctype html>
<!-- Share-card template for scripts/build-topic-images.mjs. Rendered at
     1200×630 in headless Chrome and captured as each topic's og:image; the
     script fills the fields below per topic. Same look as the section cards
     in assets/og/ (scripts/build-og.py): dark ground, mono kicker, Playfair.

     Three layouts, picked by the script from the visualization's shape:
     wide ones run in a band along the bottom; squarer ones (body.side) sit in
     a column beside the text, where a bottom band would leave them small in
     a corner; with none (body.no-viz) the title takes the middle. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/css/fonts.css">
<style>
  :root { --accent: #c84b2f; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #141210; color: #e8e2d8;
    padding: 60px 80px 56px;
    font-family: 'IBM Plex Mono', monospace;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto 1fr auto;
    grid-template-areas: "k" "t" "p" "." "v";
  }
  .kicker {
    grid-area: k;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 21px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
  }
  .kicker .site { color: #6f665b; text-transform: none; letter-spacing: 0; font-size: 19px; }
  h1 {
    grid-area: t; margin-top: 26px;
    font-family: 'Playfair Display', Georgia, serif; font-weight: 700;
    font-size: 66px; line-height: 1.06; letter-spacing: -.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pattern {
    grid-area: p; margin-top: 18px; max-width: 1000px;
    font-size: 24px; line-height: 1.45; color: #9a8e80; font-style: italic;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pattern::before { content: '◆  '; font-style: normal; color: var(--accent); }
  /* The frame hugs the visualization, so a narrower one doesn't sit in a
     wide empty box. */
  .viz {
    grid-area: v; justify-self: start;
    height: 232px; max-width: 100%; border-radius: 14px;
    background: #1b1916; border: 1px solid #2c2925;
    overflow: hidden;
  }
  .viz img { height: 100%; width: auto; max-width: 100%; object-fit: contain; display: block; }

  body.side {
    grid-template-columns: 1fr 470px; column-gap: 48px;
    grid-template-rows: auto 1fr auto auto 1fr;
    grid-template-areas: "k k" ". v" "t v" "p v" ". v";
  }
  body.side h1 { font-size: 60px; -webkit-line-clamp: 3; }
  body.side .pattern { -webkit-line-clamp: 3; }
  body.side .viz { margin-top: 30px; align-self: center; justify-self: stretch; height: auto; }
  body.side .viz img { width: 100%; height: auto; max-height: 440px; }

  body.no-viz { grid-template-rows: auto 1fr auto auto 1fr; grid-template-areas: "k" "." "t" "p" "."; }
  body.no-viz .viz { display: none; }
  body.no-viz h1 { font-size: 84px; }
</style>
</head>
<body>
  <div class="kicker"><span class="col"></span><span class="site">patterniseverything.com</span></div>
  <h1 class="title"></h1>
  <div class="pattern"></div>
  <div class="viz"><img alt=""></div>
</body>
</html>
